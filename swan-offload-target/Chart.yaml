apiVersion: v2
#
name: swan-offload-target
type: application
#
version: 0.1.0
#
description: The necessary bits that a Liqo target cluster needs to run offloaded SWAN user sessions
#
# Keep the versions in sync with the swan chart
dependencies:
  - name: eosxd-csi
    version: 1.4.8
    repository: oci://registry.cern.ch/kubernetes/charts
    condition: eosxd-csi.enabled
  - name: cvmfs-csi
    version: 2.5.2
    repository: oci://registry.cern.ch/kubernetes/charts
    condition: cvmfs-csi.enabled
