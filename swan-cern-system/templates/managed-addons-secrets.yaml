{{- $addons := .Values.managedAddons }}
{{- $monitoring := index .Values "cern-it-monitoring-kubernetes" }}
{{- if $monitoring.managedAddon }}
  {{- $addons = merge (dict "cern-it-monitoring-kubernetes" (omit $monitoring "enabled" "managedAddon")) $addons }}
{{- end }}
{{- $gpuOperator := index .Values "gpu-operator-cern" }}
{{- if $gpuOperator.managedAddon }}
  {{- $addons = merge (dict "nvidia-gpu-operator" (omit $gpuOperator "enabled" "managedAddon")) $addons }}
{{- end }}
{{- /* The gpu-operator addon wraps the gpu-operator-cern chart, so we remap the config under `gpu-operator-cern` */}}
{{- $addonMapping := dict "nvidia-gpu-operator" "gpu-operator-cern" }}
{{- range $name, $values := $addons }}
---
apiVersion: v1
kind: Secret
metadata:
  name: managed-addons-{{ $name }}
  namespace: kube-system
stringData:
  values.yaml: |-
{{ toYaml (dict (get $addonMapping $name | default $name) $values) | indent 4 }}
{{- end }}
