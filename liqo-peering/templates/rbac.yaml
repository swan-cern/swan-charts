# ServiceAccount to grant the source cluster's control plane the necessary permissions 
# to interact with resources in the target cluster.
{{- if eq .Values.role "target" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.remoteCluster.clusterId }}-controlplane
  namespace: {{ include "liqo.tenantNamespace" . }}
---
# ServiceAccount token
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.remoteCluster.clusterId }}-controlplane-token
  namespace: {{ include "liqo.tenantNamespace" . }}
  annotations:
    kubernetes.io/service-account.name: {{ .Values.remoteCluster.clusterId }}-controlplane
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: liqo-binding-liqo-remote-controlplane
  namespace: {{ include "liqo.tenantNamespace" . }}
  labels:
    liqo.io/remote-cluster-id: {{ .Values.remoteCluster.clusterId }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: liqo-remote-controlplane
subjects:
- kind: ServiceAccount
  name: {{ .Values.remoteCluster.clusterId }}-controlplane
  namespace: {{ include "liqo.tenantNamespace" . }}
{{- end }}
