# GatewayServer resource to expose a WireGuard gateway on the nodes of the target,
# to which the source connects.
{{- if eq .Values.role "target" }}
apiVersion: networking.liqo.io/v1beta1
kind: GatewayServer
metadata:
  name: {{ .Values.remoteCluster.clusterId }}
  namespace: {{ include "liqo.tenantNamespace" . }}
  labels:
    liqo.io/remote-cluster-id: {{ .Values.remoteCluster.clusterId }}
spec:
  endpoint:
    nodePort: {{ .Values.gateway.nodePort }}
    port: 51840
    serviceType: NodePort
  mtu: 1340
  secretRef:
    name: gw-{{ .Values.remoteCluster.clusterId }}
  serverTemplateRef:
    apiVersion: networking.liqo.io/v1beta1
    kind: WgGatewayServerTemplate
    name: wireguard-server
    namespace: liqo
{{- end }}
