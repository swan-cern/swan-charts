{{- if not (has .Values.role (list "source" "target")) }}
{{- fail "role must be either source or target" }}
{{- end }}
# Namespace holding the peering resources with the remote cluster.
apiVersion: v1
kind: Namespace
metadata:
  labels:
    liqo.io/remote-cluster-id: {{ .Values.remoteCluster.clusterId }}
    liqo.io/tenant-namespace: "true"
  name: {{ include "liqo.tenantNamespace" . }}
spec: {}
