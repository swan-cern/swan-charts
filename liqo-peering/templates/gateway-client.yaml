# GatewayClient resource for establishing a WireGuard tunnel to the gateway of
# the other cluster.
{{- if eq .Values.gateway.role "client" }}
apiVersion: networking.liqo.io/v1beta1
kind: GatewayClient
metadata:
  name: {{ .Values.remoteCluster.clusterId }}
  namespace: {{ include "liqo.tenantNamespace" . }}
  labels:
    liqo.io/remote-cluster-id: {{ .Values.remoteCluster.clusterId }}
spec:
  clientTemplateRef:
    apiVersion: networking.liqo.io/v1beta1
    kind: WgGatewayClientTemplate
    name: wireguard-client
    namespace: liqo
  secretRef:
    name: gw-{{ .Values.remoteCluster.clusterId }}
  endpoint:
    addresses:
      - {{ required "gateway.address is not set" .Values.gateway.address }}
    port: {{ .Values.gateway.nodePort }}
    protocol: UDP
  mtu: 1340
{{- end }}
