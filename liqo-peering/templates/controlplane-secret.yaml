# Secret containing the kubeconfig that the source uses to replicate its Liqo
# resources (ResourceSlice, NamespaceMap) to the target.
{{- if eq .Values.role "source" }}
apiVersion: v1
data:
  kubeconfig: {{ required "remoteCluster.kubeconfig is not set" .Values.remoteCluster.kubeconfig }}
kind: Secret
metadata:
  name: kubeconfig-controlplane-{{ .Values.remoteCluster.clusterId }}
  namespace: {{ include "liqo.tenantNamespace" . }}
  labels:
    liqo.io/identity-type: ControlPlane
    liqo.io/remote-cluster-id: {{ .Values.remoteCluster.clusterId }}
  annotations:
    liqo.io/remote-tenant-namespace: liqo-tenant-{{ .Values.clusterId }}
{{- end }}
