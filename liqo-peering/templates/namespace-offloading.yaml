# NamespaceOffloading resource to allow pods of the namespace to be offloaded to the target cluster.
{{- if eq .Values.role "source" }}
apiVersion: offloading.liqo.io/v1beta1
kind: NamespaceOffloading
metadata:
  name: offloading
  namespace: {{ .Values.offloading.namespace }}
spec:
  clusterSelector:
    nodeSelectorTerms: []
  namespaceMappingStrategy: EnforceSameName
  podOffloadingStrategy: {{ .Values.offloading.podOffloadingStrategy }}
{{- end }}
