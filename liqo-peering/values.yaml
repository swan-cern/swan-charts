# source: the cluster whose pods are offloaded ("consumer" in Liqo's terms)
# target: the cluster that runs the offloaded pods (the "provider")
role:

clusterId:  # ID of this cluster
privateWireguardKey:  # WireGuard key pair of the gateway of this cluster
publicWireguardKey:

remoteCluster:
  clusterId:  # ID of the other cluster
  podCidr:
  externalCidr:
  publicWireguardKey:  # public WireGuard key of its gateway
  kubeconfig:  # Source only: kubeconfig (base64 encoded) of the ServiceAccount

gateway:
  nodePort: 30840
  address:  # Source only: IP or DNS name of a node of the target

# Source only: the namespace whose pods can be offloaded
offloading:
  namespace: swan
  podOffloadingStrategy: Local

# Source only: the resources requested from the target
resourceSlice:
  name: pool
  resources:
    cpu:  # e.g. "8"
    memory:  # e.g. 32Gi
